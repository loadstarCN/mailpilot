<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailpilot - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">
<div class="bg-white p-8 rounded-lg shadow-md w-96">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold"><span class="text-green-700">Olive</span> Mailpilot</h1>
        <p class="text-gray-500 text-sm mt-1">邮件发送管理系统</p>
    </div>
    {% if error %}
    <div class="bg-red-100 text-red-700 p-3 rounded text-sm mb-4">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login">
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
            <input type="text" name="username" required autofocus
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
            <input type="password" name="password" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition">
            登录
        </button>
    </form>
</div>
<footer class="mt-6 text-center text-xs text-gray-400">
    &copy; Olive Software. All rights reserved. &middot; <a href="mailto:support@olive-app.com" class="hover:text-gray-600">support@olive-app.com</a>
</footer>
</body>
</html>
