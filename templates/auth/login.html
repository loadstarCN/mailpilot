<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailpilot - 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-bg bg-grid">
    <div class="login-card reveal">
        <div style="text-align:center;margin-bottom:32px">
            <h1 style="font-family:'Outfit',sans-serif;font-size:1.5rem;font-weight:700;letter-spacing:-0.03em">
                <span style="color:var(--accent)">Olive</span>
                <span style="color:var(--text-primary)">Mailpilot</span>
            </h1>
            <p style="font-size:0.8rem;color:var(--text-muted);margin-top:4px;letter-spacing:0.06em;text-transform:uppercase">Mail Delivery Platform</p>
        </div>
        {% if error %}
        <div class="flash flash-error" style="margin-bottom:20px">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
            {{ error }}
        </div>
        {% endif %}
        <form method="post" action="/admin/login">
            <div style="margin-bottom:18px">
                <label class="form-label">用户名</label>
                <input type="text" name="username" required autofocus class="form-input" placeholder="请输入用户名">
            </div>
            <div style="margin-bottom:26px">
                <label class="form-label">密码</label>
                <input type="password" name="password" required class="form-input" placeholder="请输入密码">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px">
                登录
            </button>
        </form>
    </div>
    <footer class="app-footer" style="position:relative;z-index:1">
        &copy; Olive Software. All rights reserved. &middot; <a href="mailto:support@olive-app.com">support@olive-app.com</a>
    </footer>
</div>
</body>
</html>
