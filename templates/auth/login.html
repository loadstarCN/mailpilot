<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailpilot - 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<script>
(function(){var t=localStorage.getItem('mailpilot-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');})();
</script>
<div class="login-bg bg-grid">
    <button type="button" class="theme-toggle login-theme-toggle" id="login-theme-toggle" title="切换主题">
        <svg class="icon-sun" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><path stroke-linecap="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg class="icon-moon" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
    </button>
    <div class="login-card reveal">
        <div style="text-align:center;margin-bottom:32px">
            <h1 style="font-family:'Outfit',sans-serif;font-size:1.5rem;font-weight:700;letter-spacing:-0.03em">
                <span style="color:var(--accent)">Olive</span>
                <span style="color:var(--text-primary)">Mailpilot</span>
            </h1>
            <p style="font-size:0.8rem;color:var(--text-muted);margin-top:4px;letter-spacing:0.06em;text-transform:uppercase">Mail Delivery Platform</p>
        </div>
        {% if error %}
        <div class="flash flash-error" style="margin-bottom:20px">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
            {{ error }}
        </div>
        {% endif %}
        <form method="post" action="/admin/login">
            <div style="margin-bottom:18px">
                <label class="form-label">用户名</label>
                <input type="text" name="username" required autofocus class="form-input" placeholder="请输入用户名">
            </div>
            <div style="margin-bottom:26px">
                <label class="form-label">密码</label>
                <input type="password" name="password" required class="form-input" placeholder="请输入密码">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px">
                登录
            </button>
        </form>
    </div>
    <footer class="app-footer" style="position:relative;z-index:1">
        &copy; Olive Software. All rights reserved. &middot; <a href="mailto:support@olive-app.com">support@olive-app.com</a>
    </footer>
</div>
<script>
(function(){
    var btn=document.getElementById('login-theme-toggle');
    if(!btn)return;
    btn.addEventListener('click',function(){
        var cur=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
        if(cur==='light'){document.documentElement.setAttribute('data-theme','light');}else{document.documentElement.removeAttribute('data-theme');}
        localStorage.setItem('mailpilot-theme',cur);
    });
})();
</script>
</body>
</html>
