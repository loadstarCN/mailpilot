{% extends "base.html" %}
{% set active_page = "projects" %}
{% block title %}{{ '编辑项目' if project else '新建项目' }} - Mailpilot{% endblock %}
{% block content %}
<div style="max-width:48rem;width:100%">
    <h2 class="page-title reveal">{{ '编辑项目' if project else '新建项目' }}</h2>
    <form method="post" action="{{ '/admin/projects/' ~ project.id ~ '/edit' if project else '/admin/projects/create' }}"
          class="form-card reveal reveal-delay-1" style="display:flex;flex-direction:column;gap:18px">
        <input type="hidden" name="_csrf_token" value="{{ request.state.csrf_token }}">
        <div>
            <label class="form-label">项目名称</label>
            <input type="text" name="name" value="{{ project.name if project else '' }}" required
                   class="form-input" placeholder="输入项目名称">
        </div>
        {% if project %}
        <div>
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                <input type="checkbox" name="is_active" class="form-checkbox" {{ 'checked' if project.is_active }}>
                <span style="font-size:0.85rem;color:var(--text-secondary)">启用</span>
            </label>
        </div>
        {% endif %}
        <div style="display:flex;gap:10px">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/admin/projects" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
