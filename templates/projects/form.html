{% extends "base.html" %}
{% set active_page = "projects" %}
{% block title %}{{ '编辑项目' if project else '新建项目' }} - Mailpilot{% endblock %}
{% block content %}
<div class="max-w-lg">
    <h2 class="text-2xl font-bold mb-6">{{ '编辑项目' if project else '新建项目' }}</h2>
    <form method="post" action="{{ '/admin/projects/' ~ project.id ~ '/edit' if project else '/admin/projects/create' }}"
          class="bg-white rounded-lg shadow p-6 space-y-4">
        <input type="hidden" name="_csrf_token" value="{{ request.state.csrf_token }}">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">项目名称</label>
            <input type="text" name="name" value="{{ project.name if project else '' }}" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        {% if project %}
        <div>
            <label class="flex items-center">
                <input type="checkbox" name="is_active" class="mr-2" {{ 'checked' if project.is_active }}>
                <span class="text-sm text-gray-700">启用</span>
            </label>
        </div>
        {% endif %}
        <div class="flex gap-3">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm">保存</button>
            <a href="/admin/projects" class="px-4 py-2 border rounded text-sm hover:bg-gray-50">取消</a>
        </div>
    </form>
</div>
{% endblock %}
