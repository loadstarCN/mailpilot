{% extends "base.html" %}
{% set active_page = "templates" %}
{% block title %}{{ '编辑模板' if tpl else '新建模板' }} - Mailpilot{% endblock %}
{% block content %}
<div style="max-width:48rem;width:100%">
    <h2 class="page-title reveal">{{ '编辑模板' if tpl else '新建模板' }}</h2>
    <form method="post" action="{{ '/admin/templates/' ~ tpl.id ~ '/edit' if tpl else '/admin/templates/create' }}"
          class="form-card reveal reveal-delay-1" style="display:flex;flex-direction:column;gap:18px">
        <input type="hidden" name="_csrf_token" value="{{ request.state.csrf_token }}">
        <div>
            <label class="form-label">所属项目</label>
            <select name="project_id" required class="form-input" {{ 'disabled' if tpl }}>
                {% for p in projects %}
                <option value="{{ p.id }}" {{ 'selected' if tpl and tpl.project_id == p.id }}>{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="grid-2-form">
            <div>
                <label class="form-label">模板名称</label>
                <input type="text" name="name" value="{{ tpl.name if tpl else '' }}" required
                       class="form-input" placeholder="如：welcome_email">
            </div>
            <div>
                <label class="form-label">描述</label>
                <input type="text" name="description" value="{{ tpl.description or '' if tpl else '' }}" class="form-input">
            </div>
        </div>
        <div>
            <label class="form-label">邮件主题（支持 Jinja2 变量）</label>
            <input type="text" name="subject" value="{{ tpl.subject if tpl else '' }}" required
                   class="form-input" placeholder="如：欢迎 {{ '{{' }} username {{ '}}' }}">
        </div>
        <div>
            <label class="form-label">HTML 内容</label>
            <textarea name="body_html" rows="10" required
                      class="form-input" style="font-family:'JetBrains Mono',monospace;font-size:0.8rem">{{ tpl.body_html if tpl else '' }}</textarea>
        </div>
        <div>
            <label class="form-label">纯文本内容（可选）</label>
            <textarea name="body_text" rows="4"
                      class="form-input" style="font-family:'JetBrains Mono',monospace;font-size:0.8rem">{{ tpl.body_text or '' if tpl else '' }}</textarea>
        </div>
        {% if tpl %}
        <div>
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                <input type="checkbox" name="is_active" class="form-checkbox" {{ 'checked' if tpl.is_active }}>
                <span style="font-size:0.85rem;color:var(--text-secondary)">启用</span>
            </label>
        </div>
        {% endif %}
        <div style="display:flex;gap:10px">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/admin/templates" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
