{% extends "base.html" %}
{% set active_page = "templates" %}
{% block title %}{{ '编辑模板' if tpl else '新建模板' }} - Mailpilot{% endblock %}
{% block content %}
<div class="max-w-2xl">
    <h2 class="text-2xl font-bold mb-6">{{ '编辑模板' if tpl else '新建模板' }}</h2>
    <form method="post" action="{{ '/admin/templates/' ~ tpl.id ~ '/edit' if tpl else '/admin/templates/create' }}"
          class="bg-white rounded-lg shadow p-6 space-y-4">
        <input type="hidden" name="_csrf_token" value="{{ request.state.csrf_token }}">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">所属项目</label>
            <select name="project_id" required class="w-full px-3 py-2 border rounded-md" {{ 'disabled' if tpl }}>
                {% for p in projects %}
                <option value="{{ p.id }}" {{ 'selected' if tpl and tpl.project_id == p.id }}>{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">模板名称</label>
                <input type="text" name="name" value="{{ tpl.name if tpl else '' }}" required
                       class="w-full px-3 py-2 border rounded-md" placeholder="如：welcome_email">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                <input type="text" name="description" value="{{ tpl.description or '' if tpl else '' }}"
                       class="w-full px-3 py-2 border rounded-md">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">邮件主题（支持 Jinja2 变量）</label>
            <input type="text" name="subject" value="{{ tpl.subject if tpl else '' }}" required
                   class="w-full px-3 py-2 border rounded-md" placeholder="如：欢迎 {{ '{{' }} username {{ '}}' }}">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">HTML 内容</label>
            <textarea name="body_html" rows="10" required
                      class="w-full px-3 py-2 border rounded-md font-mono text-sm">{{ tpl.body_html if tpl else '' }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">纯文本内容（可选）</label>
            <textarea name="body_text" rows="4"
                      class="w-full px-3 py-2 border rounded-md font-mono text-sm">{{ tpl.body_text or '' if tpl else '' }}</textarea>
        </div>
        {% if tpl %}
        <div>
            <label class="flex items-center">
                <input type="checkbox" name="is_active" class="mr-2" {{ 'checked' if tpl.is_active }}>
                <span class="text-sm text-gray-700">启用</span>
            </label>
        </div>
        {% endif %}
        <div class="flex gap-3">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm">保存</button>
            <a href="/admin/templates" class="px-4 py-2 border rounded text-sm hover:bg-gray-50">取消</a>
        </div>
    </form>
</div>
{% endblock %}
