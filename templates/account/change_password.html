{% extends "base.html" %}
{% set active_page = "account" %}
{% block title %}修改密码 - Mailpilot{% endblock %}
{% block content %}
<div style="max-width:32rem">
    <h2 class="page-title reveal">修改密码</h2>
    {% if error %}
    <div class="flash flash-error reveal" style="margin-bottom:20px">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
        {{ error }}
    </div>
    {% endif %}
    <form method="post" action="/admin/account/change-password"
          class="form-card reveal reveal-delay-1" style="display:flex;flex-direction:column;gap:18px">
        <input type="hidden" name="_csrf_token" value="{{ request.state.csrf_token }}">
        <div>
            <label class="form-label">当前密码</label>
            <input type="password" name="old_password" required autocomplete="current-password" class="form-input">
        </div>
        <div>
            <label class="form-label">新密码</label>
            <input type="password" name="new_password" required autocomplete="new-password" class="form-input">
        </div>
        <div>
            <label class="form-label">确认新密码</label>
            <input type="password" name="confirm_password" required autocomplete="new-password" class="form-input">
        </div>
        <div style="display:flex;gap:10px">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/admin/dashboard" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
