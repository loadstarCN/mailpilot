{% extends "base.html" %}
{% set active_page = "account" %}
{% block title %}修改密码 - Mailpilot{% endblock %}
{% block content %}
<div class="max-w-lg">
    <h2 class="text-2xl font-bold mb-6">修改密码</h2>
    {% if error %}
    <div class="mb-4 p-3 rounded text-sm bg-red-100 text-red-700">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/account/change-password"
          class="bg-white rounded-lg shadow p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">当前密码</label>
            <input type="password" name="old_password" required autocomplete="current-password"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">新密码</label>
            <input type="password" name="new_password" required autocomplete="new-password"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">确认新密码</label>
            <input type="password" name="confirm_password" required autocomplete="new-password"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="flex gap-3">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm">保存</button>
            <a href="/admin/dashboard" class="px-4 py-2 border rounded text-sm hover:bg-gray-50">取消</a>
        </div>
    </form>
</div>
{% endblock %}
