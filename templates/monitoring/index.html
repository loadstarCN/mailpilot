{% extends "base.html" %}
{% set active_page = "monitoring" %}
{% block title %}监控 - Mailpilot{% endblock %}
{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
{% endblock %}
{% block content %}
<h2 class="page-title reveal">实时监控</h2>

<div class="grid-3">
    <!-- Worker 状态 -->
    <div class="card reveal reveal-delay-1">
        <div class="card-header">Worker 状态</div>
        <div id="worker-status" style="font-size:0.85rem;display:flex;flex-direction:column;gap:8px">
            <div class="queue-row"><span>状态</span><span id="ws-running">-</span></div>
            <div class="queue-row"><span>并发数</span><span id="ws-concurrency">-</span></div>
            <div class="queue-row"><span>活跃任务</span><span id="ws-active">-</span></div>
            <div class="queue-row"><span>运行时间</span><span id="ws-uptime">-</span></div>
        </div>
    </div>

    <!-- 队列深度 -->
    <div class="card reveal reveal-delay-2">
        <div class="card-header">队列深度</div>
        <div id="queue-depth" style="font-size:0.85rem;display:flex;flex-direction:column;gap:8px"></div>
    </div>

    <!-- 计数器 -->
    <div class="card reveal reveal-delay-3">
        <div class="card-header">实时计数</div>
        <div style="font-size:0.85rem;display:flex;flex-direction:column;gap:8px">
            <div class="queue-row"><span>成功</span><span id="rt-success" class="text-success">0</span></div>
            <div class="queue-row"><span>失败</span><span id="rt-failed" class="text-danger">0</span></div>
        </div>
    </div>
</div>

<!-- 趋势图 -->
<div class="card reveal reveal-delay-4" style="margin-bottom:24px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div class="card-header" style="margin-bottom:0">发送趋势</div>
        <div style="display:flex;gap:6px">
            <button onclick="loadTrend('day')" class="trend-btn" id="btn-day">24小时</button>
            <button onclick="loadTrend('week')" class="trend-btn" id="btn-week">7天</button>
            <button onclick="loadTrend('month')" class="trend-btn" id="btn-month">30天</button>
        </div>
    </div>
    <canvas id="trendChart" height="80"></canvas>
</div>

<!-- 实时动态流 -->
<div class="card reveal reveal-delay-5">
    <div class="card-header">实时发送动态</div>
    <div id="activity-feed" style="max-height:400px;overflow-y:auto">
        <p class="text-muted" style="font-size:0.85rem" id="feed-empty">等待事件...</p>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
let trendChart = null;
let rtSuccess = 0;
let rtFailed = 0;
const statusLabels = {pending: '待发送', processing: '发送中', sent: '已发送', failed: '失败', retry: '重试中', cancelled: '已取消'};

async function loadTrend(period) {
    const resp = await fetch(`/admin/monitoring/api/trend?period=${period}`);
    const data = await resp.json();
    const labels = data.map(d => {
        const dt = new Date(d.time_bucket);
        return period === 'day' ? dt.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'})
                                : dt.toLocaleDateString('zh-CN', {month: '2-digit', day: '2-digit'});
    });

    if (trendChart) trendChart.destroy();
    const ctx = document.getElementById('trendChart').getContext('2d');
    trendChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                {label: '成功', data: data.map(d => d.success), borderColor: '#4ade80', backgroundColor: 'rgba(74,222,128,0.08)', tension: 0.4, fill: true, pointRadius: 0, borderWidth: 2},
                {label: '失败', data: data.map(d => d.failed), borderColor: '#f87171', backgroundColor: 'rgba(248,113,113,0.05)', tension: 0.4, fill: true, pointRadius: 0, borderWidth: 2},
                {label: '总数', data: data.map(d => d.total), borderColor: '#5a6785', borderDash: [5,5], tension: 0.4, fill: false, pointRadius: 0, borderWidth: 1.5},
            ]
        },
        options: {
            responsive: true,
            interaction: { mode: 'index', intersect: false },
            scales: {
                y: { beginAtZero: true, grid: { color: 'rgba(99,140,255,0.06)' }, ticks: { color: '#5a6785', font: { size: 11 } } },
                x: { grid: { color: 'rgba(99,140,255,0.04)' }, ticks: { color: '#5a6785', font: { size: 11 }, maxRotation: 0 } }
            },
            plugins: {
                legend: { position: 'bottom', labels: { color: '#8b97b8', padding: 20, usePointStyle: true, pointStyleWidth: 8, font: { size: 12 } } },
                tooltip: { backgroundColor: '#162040', borderColor: 'rgba(99,140,255,0.15)', borderWidth: 1, titleColor: '#e8ecf4', bodyColor: '#8b97b8', padding: 12, cornerRadius: 8 }
            }
        }
    });

    document.querySelectorAll('.trend-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-${period}`).classList.add('active');
}

async function loadWorkerStatus() {
    try {
        const resp = await fetch('/admin/monitoring/api/worker-status');
        const data = await resp.json();
        const el = document.getElementById('ws-running');
        el.textContent = data.running ? '运行中' : '已停止';
        el.className = data.running ? 'text-success' : 'text-danger';
        el.style.fontFamily = "'Outfit',sans-serif";
        el.style.fontWeight = '600';
        document.getElementById('ws-concurrency').textContent = data.concurrency;
        document.getElementById('ws-active').textContent = data.active_tasks;
        const hours = Math.floor(data.uptime_seconds / 3600);
        const mins = Math.floor((data.uptime_seconds % 3600) / 60);
        document.getElementById('ws-uptime').textContent = `${hours}h ${mins}m`;
    } catch (e) {}
}

async function loadQueueDepth() {
    try {
        const resp = await fetch('/admin/monitoring/api/queue-depth');
        const data = await resp.json();
        const el = document.getElementById('queue-depth');
        el.textContent = '';
        const entries = Object.entries(data);
        if (entries.length === 0) {
            el.innerHTML = '<span class="text-muted">空</span>';
        } else {
            entries.forEach(([k, v]) => {
                const row = document.createElement('div');
                row.className = 'queue-row';
                row.innerHTML = `<span>${statusLabels[k] || k}</span><span>${v}</span>`;
                el.appendChild(row);
            });
        }
    } catch (e) {}
}

// SSE
const source = new EventSource('/admin/monitoring/sse');
source.addEventListener('send_event', function(e) {
    const event = JSON.parse(e.data);
    document.getElementById('feed-empty')?.remove();
    const feed = document.getElementById('activity-feed');
    const isSent = event.status === 'sent';
    const time = new Date(event.timestamp).toLocaleTimeString('zh-CN');
    const div = document.createElement('div');
    div.className = 'feed-item';
    div.innerHTML = `
        <span class="feed-time">${time}</span>
        <span class="badge badge-${event.status}" style="font-size:0.68rem">${statusLabels[event.status] || event.status}</span>
        <span style="color:var(--text-primary);font-weight:500">${event.project}</span>
        <span class="text-muted" style="font-size:0.8rem">&rarr; ${event.to}</span>
        <span class="text-muted" style="font-size:0.75rem;opacity:0.6;margin-left:auto">${event.subject.substring(0, 30)}</span>
    `;
    feed.insertBefore(div, feed.firstChild);
    if (feed.children.length > 50) feed.removeChild(feed.lastChild);

    if (isSent) rtSuccess++;
    else rtFailed++;
    document.getElementById('rt-success').textContent = rtSuccess;
    document.getElementById('rt-failed').textContent = rtFailed;
});

// 初始化
loadTrend('day');
loadWorkerStatus();
loadQueueDepth();
setInterval(loadWorkerStatus, 10000);
setInterval(loadQueueDepth, 10000);
</script>
{% endblock %}
