[project]
name = "mailpilot"
version = "0.1.0"
description = "A lightweight, self-hosted email delivery service"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.1.0",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
